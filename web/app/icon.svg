<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Off-white paper background (rounded for iOS/PWA) -->
  <rect width="64" height="64" rx="10" fill="#FAF8F5"/>
  <!-- Triangle outline — deep ink, slightly heavier stroke for small-size legibility -->
  <path d="M10 52 L54 52 L22 10 Z" stroke="#17140F" stroke-width="4" fill="none" stroke-linejoin="miter"/>
  <!-- Internal line from apex to accent dot -->
  <line x1="22" y1="10" x2="40" y2="44" stroke="#17140F" stroke-width="4"/>
  <!-- Magenta accent dot -->
  <circle cx="40" cy="44" r="6" fill="#A01E78"/>
</svg>
